plugins {
    id "com.android.application"
}

android {
    namespace "io.github.leoaudio.shell"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.leoaudio.shell"
        minSdk 24
        targetSdk 36
        versionCode 10
        versionName "0.3.0-gate3.1"
    }

    flavorDimensions += "mode"
    productFlavors {
        safePreview {
            dimension "mode"
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            manifestPlaceholders = [appLabel: "Leo Shell 安全预览"]
            buildConfigField "boolean", "HOME_CAPABLE", "false"
        }
        homeCandidate {
            dimension "mode"
            versionNameSuffix "-home"
            manifestPlaceholders = [appLabel: "Leo Shell HOME 候选"]
            buildConfigField "boolean", "HOME_CAPABLE", "true"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Gate 3 is deliberately Java-only.  AGP 9 otherwise injects kotlin-stdlib
    // even though this module has no Kotlin source or runtime dependency.
    enableKotlin = false

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
