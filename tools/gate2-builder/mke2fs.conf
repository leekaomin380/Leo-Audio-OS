[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,ext_attr,extent,uninit_bg
	enable_periodic_fsck = 0
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384
	# The stock leo system image has no default acl/user_xattr mount flags.
	default_mntopts = ^acl,^user_xattr
	# The source superblock selects the legacy TEA directory hash algorithm.
	hash_alg = tea

[fs_types]
	ext4 = {
		features = has_journal
	}
